# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
    # Transitive duplicates we can't resolve — all pulled by reqwest's dependency tree
    { crate = "core-foundation@0.9", reason = "system-configuration pulls old version" },
    { crate = "toml_datetime@0.6", reason = "toml_edit still on 0.6" },
    { crate = "windows-sys@0.60", reason = "socket2/tokio still on 0.60" },
    { crate = "hashbrown@0.17", reason = "gix-hashtable on 0.17, rest of tree on 0.16" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
