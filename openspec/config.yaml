schema: spec-driven

context: |
    gx is a Rust CLI tool for managing GitHub Actions versions.
    Tech stack: Rust, clap, tokio, reqwest. Built with mise tasks.
    Specs should only cover user-facing behavior and high-level project direction.
    What tends to go wrong here: version-resolution edge cases and network/API failure handling.

rules:
    proposal:
        - Justify why this change requires a spec (reference the relevance gate)
        - "Gate — requires spec: adds, removes, or changes user-facing behavior"
        - "Gate — requires spec: introduces a new domain concept that changes what users can do"
        - "Skip spec: internal refactoring with no user-visible change"
        - "Skip spec: CI/tooling, dependency updates, packaging chores"
        - "Skip spec: bug fix with an obvious solution"
        - "Skip spec: would duplicate an existing spec"
        - When archiving, update the spec to match what actually shipped
        - When a rule already lives upstream, point to it instead of restating it
    specs:
        - Every spec must trace to something a user cares about
        - Name the user who benefits and describe what they'd notice
        - The schema owns scenario format — follow it rather than a copy kept here
        - Architectural guardrails are constraints on how value is delivered — they must be load-bearing (violating one would degrade user value)
        - Error classification determines whether user sees warning or hard failure
    design:
        - Include an "Automated Test Strategy" section — what level of testing, what's the critical path, any new test infrastructure
        - Include an "Observability" section — how failures surface, what error paths exist, whether a failure can be silent
        - Both sections can be brief for a simple change, but must be present when a design is written
