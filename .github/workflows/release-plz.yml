name: Release-plz

on:
    push:
        branches:
            - main

permissions: {}

env:
    MISE_LOCKED: 1

jobs:
    release-plz-release:
        name: Release-plz release
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5
            - name: Generate authentication token with GitHub App to trigger Actions
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
              id: app-token
              with:
                  client-id: ${{ secrets.VERIFIED_COMMIT_CLIENT_ID }}
                  private-key: ${{ secrets.VERIFIED_COMMIT_KEY }}
                  repositories: ${{ github.event.repository.name }}
                  owner: ${{ github.repository_owner }}
            - uses: release-plz/action@1528104d2ca23787631a1c1f022abb64b34c1e11 # v0.5.128
              with:
                  command: release
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

    release-plz-pr:
        name: Release-plz PR
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            pull-requests: write
        concurrency:
            group: release-plz-${{ github.ref }}
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5
            - name: Generate authentication token with GitHub App to trigger Actions
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
              id: app-token
              with:
                  client-id: ${{ secrets.VERIFIED_COMMIT_CLIENT_ID }}
                  private-key: ${{ secrets.VERIFIED_COMMIT_KEY }}
                  repositories: ${{ github.event.repository.name }}
                  owner: ${{ github.repository_owner }}
            - uses: release-plz/action@1528104d2ca23787631a1c1f022abb64b34c1e11 # v0.5.128
              with:
                  command: release-pr
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
