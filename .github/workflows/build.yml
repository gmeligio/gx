name: Build

on:
    pull_request:
        branches: [main]

# Read-only permissions by default
permissions:
    contents: read

# Synced from min_version in .config/mise.toml by `mise run mise-version`.
# Don't edit by hand — change min_version instead and re-run that task.
env:
    MISE_VERSION: 2026.7.13

jobs:
    check:
        name: Check
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
              with:
                  version: ${{ env.MISE_VERSION }}
            - run: mise run check

    fmt:
        name: Format
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            # Reads toolchain + components from rust-toolchain.toml.
            # Runs before mise-action so rustup has the components installed
            # before mise sets RUSTUP_TOOLCHAIN.
            - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
            - uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
              with:
                  version: ${{ env.MISE_VERSION }}
            - run: mise run format:check

    clippy:
        name: Clippy
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            # Reads toolchain + components from rust-toolchain.toml.
            # Runs before mise-action so rustup has the components installed
            # before mise sets RUSTUP_TOOLCHAIN.
            - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
            - uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
              with:
                  version: ${{ env.MISE_VERSION }}
            - run: mise run clippy:check

    unit-tests:
        name: Unit Tests
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
              with:
                  version: ${{ env.MISE_VERSION }}
            - run: mise run test:unit

    size:
        name: Size
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
              with:
                  version: ${{ env.MISE_VERSION }}
            - run: mise run lint:size

    integration-tests:
        name: Integration Tests
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
              with:
                  version: ${{ env.MISE_VERSION }}
            - run: mise run integ

    e2e-tests:
        name: E2E Tests
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
              with:
                  version: ${{ env.MISE_VERSION }}
            - run: mise run e2e
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    deny:
        name: Deny
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
              with:
                  version: ${{ env.MISE_VERSION }}
            - run: mise run deny

    lockfile:
        name: Lockfile
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
              with:
                  version: ${{ env.MISE_VERSION }}
            - run: mise run lock:check
